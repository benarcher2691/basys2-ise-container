################################################################################
# Batch-installer config for ISE 14.7 (batchxsetup -batch install.cfg).
# Format taken from the config shipped with the installer, as used by
# codepainters/ise14 and I-A-S/Docked-ISE-147. WebPACK only; everything
# optional is off.
################################################################################

destination_dir=/opt/Xilinx

copy_preferences=N

use_multiple_cores=Y

eula_accepted=Y

# The licence is mounted at run time, not set up by the installer.
application=Acquire or Manage a License Key::0

package=ISE WebPACK::1
application=setupEnv.sh::0
application=Install Linux System Generator Info XML::0
application=Ensure Linux System Generator Symlinks::0
application=Install Cable Drivers::0
